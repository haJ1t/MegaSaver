packages:
  - "apps/*"
  - "packages/*"
  - "packages/connectors/*"

# pnpm 10+ ignores dependency build scripts unless allow-listed here. These
# need their native/binary postinstall to run (biome/esbuild/sharp binaries,
# onnxruntime native addon, protobufjs codegen); without them the build fails.
allowBuilds:
  '@biomejs/biome': true
  esbuild: true
  fs-ext: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true

overrides:
  hono: ^4.12.25
  fast-uri: ^3.1.5
  sharp: ^0.35.3
  ip-address: ^10.3.1
  protobufjs: ^7.6.5
  tar: ^7.5.21
  "@hono/node-server": ^1.19.15
  body-parser: ^2.3.0
