name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # `pnpm verify` = lint + typecheck + test + conventions:check. turbo's
      # typecheck/test tasks dependsOn ^build, so this is cold-start safe; the
      # explicit Build step above warms the turbo cache and surfaces build
      # errors as their own step.
      - name: Verify
        run: pnpm verify

      # Build the standalone CLI bundle and run it. The TypeScript compiler is
      # inlined (via @megasaver/indexer) and initializes at module load, so a
      # broken ESM bundle (e.g. missing __filename/__dirname shim) crashes here
      # before any command runs. Guards the GitHub Release artifact.
      - name: Bundle smoke
        run: |
          pnpm --filter @megasaver/cli bundle
          pnpm --filter @megasaver/cli exec vitest run test/bundle-smoke.test.ts -t 'runs cache advice twice through the freshly built public bundle|keeps fresh bundle cache advice disabled on Windows without state|migrates a legacy flat v2 tree before serving advice through the freshly built public bundle|leaves no raw session, path, URL, or secret anywhere after legacy migration|keeps fresh bundle cache-advice-maintain disabled on Windows without state|fails open in a copied raw bundle when cache advice state setup is unsafe|runs task kickoff inside the single published bundle|handles a raw bundle without fs-ext within the Task Kickoff deadline|does not initialize an empty external target through a stable store-root symlink|does not initialize an empty external target through lexical store-root symlink spellings|does not write intent through a stable store-root symlink|skips an unsafe nested-cwd intent directory while delivering task kickoff|captures the latest prompt after a same-session kickoff claim|captures intent for an unindexed no-output prompt|initializes a fresh default store before capturing intent|initializes a nested custom store before capturing intent|ships no platform-specific|does not inline the onnxruntime|does not inline the fs-ext|does not inline the @aws-sdk|keeps mega.mjs under 12MB|inlines the GUI bridge'
          pnpm --filter @megasaver/stats exec vitest run test/task-kickoff-event-fallback.test.ts
          pnpm --filter @megasaver/cli exec vitest run test/hooks/task-kickoff-process.test.ts -t 'records a delivered event from the parent after settling stdout delivery|stops a locked event append at the absolute Task Kickoff deadline'
          pnpm --filter @megasaver/cli exec vitest run test/hooks/task-kickoff-hardening.test.ts -t 'kills a started detached Git process group before its delayed descendant survives'
          pnpm --filter @megasaver/cli exec vitest run test/hooks/task-kickoff-worker.test.ts -t 'finishes intent capture after the parent acknowledges delivery|stops after a late root preflight without starting deadline-expired work|does not capture intent when its preflight resolves after the deadline'
          node apps/cli/dist-bundle/mega.mjs doctor

      - name: Packed bin cache-advice smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pack_dir="$(mktemp -d)"
          install_dir="$(mktemp -d)"
          pnpm --dir apps/cli pack --out "$pack_dir/megasaver-cli.tgz"
          npm install --prefix "$install_dir" "$pack_dir/megasaver-cli.tgz"
          MEGASAVER_PACKED_MEGA="$install_dir/node_modules/.bin/mega" \
            pnpm --filter @megasaver/cli exec vitest run test/bundle-smoke.test.ts \
              -t 'runs cache advice twice through the installed packed mega bin|keeps installed packed cache advice disabled on Windows without state|migrates a legacy flat v2 tree before serving advice through the installed packed mega bin'
