name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # `pnpm verify` = lint + typecheck + test + conventions:check. turbo's
      # typecheck/test tasks dependsOn ^build, so this is cold-start safe; the
      # explicit Build step above warms the turbo cache and surfaces build
      # errors as their own step.
      - name: Verify
        run: pnpm verify

      # Build the standalone CLI bundle and run it. The TypeScript compiler is
      # inlined (via @megasaver/indexer) and initializes at module load, so a
      # broken ESM bundle (e.g. missing __filename/__dirname shim) crashes here
      # before any command runs. Guards the GitHub Release artifact.
      - name: Bundle smoke
        env:
          MEGASAVER_BUNDLE_CANCEL_REQUIRE_GIT_START: "1"
          MEGASAVER_BUNDLE_REQUIRE_TASK_KICKOFF_DELIVERY: "1"
        run: |
          pnpm --filter @megasaver/cli bundle
          pnpm --filter @megasaver/cli exec vitest run test/bundle-smoke.test.ts -t 'runs task kickoff inside the single published bundle|does not initialize an empty external target through a stable store-root symlink|does not initialize an empty external target through lexical store-root symlink spellings|does not write intent through a stable store-root symlink|skips an unsafe nested-cwd intent directory while delivering task kickoff|captures the latest prompt after a same-session kickoff claim|captures intent for an unindexed no-output prompt|initializes a fresh default store before capturing intent|initializes a nested custom store before capturing intent|captures intent while delayed Git preparation times out|cancels delayed Git in the single published bundle|ships no platform-specific|does not inline the onnxruntime|does not inline the @aws-sdk|keeps mega.mjs under 12MB|inlines the GUI bridge'
          pnpm --filter @megasaver/cli exec vitest run test/hooks/task-kickoff-worker.test.ts -t 'records a delivered event before closing when optional intent capture throws|stops after a late root preflight without starting deadline-expired work|does not capture intent when its preflight resolves after the deadline'
          node apps/cli/dist-bundle/mega.mjs doctor
