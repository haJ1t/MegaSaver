name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # `pnpm verify` = lint + typecheck + test + conventions:check. turbo's
      # typecheck/test tasks dependsOn ^build, so this is cold-start safe; the
      # explicit Build step above warms the turbo cache and surfaces build
      # errors as their own step.
      # Windows runners transform ~430x slower than a dev machine (382 s vs
      # 886 ms for one package's 48 files), and workers starve the main
      # thread's transform until their SSR module fetches time out:
      #
      #   Error: [vitest-worker]: Timeout calling "fetch" with [..., "ssr"]
      #   Test Files 3 failed | 45 passed   Tests 335 passed | 0 failed
      #
      # Zero assertions fail; the files die during collection, and WHICH files
      # shifts between runs. Capping one package only moved the pressure to the
      # next one, so the cap belongs here, once, rather than in thirty configs.
      # ubuntu is left exactly as it was.
      # `pnpm verify` expanded so the worker cap reaches vitest. VITEST_MAX_THREADS
      # is NOT honoured by vitest 2.1 -- measured: setting it to 1 left aggregate
      # test time at 275 s, unchanged. The CLI flag is honoured, and turbo
      # forwards it: the same run drops to 40 s aggregate, with transform 1.3 s
      # -> 388 ms and collect 4 s -> 1.4 s. That reduction in duplicated
      # transform is exactly what the starved runner needs.
      - name: Verify (Windows, capped workers)
        if: runner.os == 'Windows'
        run: pnpm lint && pnpm typecheck && pnpm test -- --maxWorkers=2 --minWorkers=1 && pnpm conventions:check

      - name: Verify
        if: runner.os != 'Windows'
        run: pnpm verify

      # Build the standalone CLI bundle and run it. The TypeScript compiler is
      # inlined (via @megasaver/indexer) and initializes at module load, so a
      # broken ESM bundle (e.g. missing __filename/__dirname shim) crashes here
      # before any command runs. Guards the GitHub Release artifact.
      #
      # This step — not `pnpm verify` above — is the authoritative run of
      # bundle-smoke.test.ts. Every case in that file is gated on dist-bundle/,
      # which does not exist yet during `verify`, so the file passes there while
      # executing nothing. Two rules keep that from ever being the whole story:
      #   1. No `-t` filter. A hand-listed subset silently drops any case whose
      #      name is not in it; six cases had already fallen out that way.
      #   2. MEGA_REQUIRE_BUNDLE=1 turns "bundle absent -> skip" into a hard
      #      collection failure, so a dropped/renamed/failed bundle build cannot
      #      read as green. Developer runs leave it unset and skip gracefully.
      - name: Bundle smoke
        env:
          MEGA_REQUIRE_BUNDLE: "1"
        run: |
          pnpm --filter @megasaver/cli bundle
          pnpm --filter @megasaver/cli exec vitest run test/bundle-smoke.test.ts
          pnpm --filter @megasaver/stats exec vitest run test/task-kickoff-event-fallback.test.ts
          pnpm --filter @megasaver/cli exec vitest run test/hooks/task-kickoff-process.test.ts -t 'records a delivered event from the parent after settling stdout delivery|stops a locked event append at the absolute Task Kickoff deadline'
          pnpm --filter @megasaver/cli exec vitest run test/hooks/task-kickoff-hardening.test.ts -t 'kills a started detached Git process group before its delayed descendant survives'
          pnpm --filter @megasaver/cli exec vitest run test/hooks/task-kickoff-worker.test.ts -t 'finishes intent capture after the parent acknowledges delivery|stops after a late root preflight without starting deadline-expired work|does not capture intent when its preflight resolves after the deadline'
          node apps/cli/dist-bundle/mega.mjs doctor

      # `pack` runs apps/cli's prepack, which rebuilds dist-bundle AND copies the
      # built GUI into it — so this is the only step where the packed `mega` bin
      # and dist-bundle/gui both exist. Both MEGA_REQUIRE_* flags are declared for
      # the same reason as above: without them a prepack that stopped producing
      # either artifact would turn these cases into silent skips. The suite sees
      # MEGA_REQUIRE_PACKED_MEGA and skips the freshly-built-bundle cases, which
      # already ran under MEGA_REQUIRE_BUNDLE=1 in the previous step.
      - name: Packed bin cache-advice smoke
        if: runner.os == 'Linux'
        shell: bash
        env:
          MEGA_REQUIRE_PACKED_MEGA: "1"
          MEGA_REQUIRE_PUBLISHED_GUI: "1"
        run: |
          pack_dir="$(mktemp -d)"
          install_dir="$(mktemp -d)"
          pnpm --dir apps/cli pack --out "$pack_dir/megasaver-cli.tgz"
          npm install --prefix "$install_dir" "$pack_dir/megasaver-cli.tgz"
          MEGASAVER_PACKED_MEGA="$install_dir/node_modules/.bin/mega" \
            pnpm --filter @megasaver/cli exec vitest run test/bundle-smoke.test.ts
